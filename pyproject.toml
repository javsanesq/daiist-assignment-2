[project]
name = "daiist-assignment2"
version = "0.1.0"
description = "Assignment 2: finetune a YOLO model and turn its scores into a costed operating decision"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.4,<8.5",
    "roboflow>=1.7",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "opencv-python-headless>=4.10",
    "torch>=2.7,<2.12",
    "torchvision>=0.19",
    "gradio>=5.0,<7.0",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "pytest>=8.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
